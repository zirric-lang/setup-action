name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - id: zirric
        uses: zirric-lang/setup-action@main

      - name: Run a Zirric program
        shell: bash
        run: |
          echo "installed ${{ steps.zirric.outputs.zirric-version }}"
          zirric run examples/hello.zirr
